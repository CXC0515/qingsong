设计决定：主界面反映本地已记事实；云端确认独立显示。收交是状态，表现是事件。
验证边界：模拟同步不证明真实系统的延迟、持久性或冲突处理，生产实现须另行审批。
修改历史：v1.1 整张卡片可记录，状态并入姓名按钮，负结果保留独立按钮。

<body>
<div class="shell">
  <aside class="sidebar" aria-label="工作台导航"><div class="brand"><span class="brand-mark">松</span>青松教师</div><div><p class="side-caption">教学工作</p><div class="nav-current"><svg viewBox="0 0 24 24"><path d="M4 5h6l2 2 2-2h6v14h-6l-2 2-2-2H4zM12 7v14"/></svg>课堂记录</div></div><div class="side-note">交互原型 v1.1<br>模拟学生与同步过程<br>不会写入线上数据</div></aside>
  <main class="workspace">
    <header class="topline"><h1>课堂记录</h1><span class="prototype">交互原型 · 模拟数据</span></header>
    <section class="context" aria-label="记录上下文">
      <select id="classSelect" aria-label="选择班级"><option value="a">七年级一班</option><option value="b">七年级二班</option></select>
      <input id="dateSelect" class="date" type="date" aria-label="记录日期">
      <select id="roundSelect" aria-label="选择检查次数"></select>
      <div class="context-right"><button id="newRound" class="text-button">新一次检查</button><button id="historyButton" class="text-button strong">本次记录 ↗</button></div>
    </section>
    <section id="projects" class="projects" aria-label="选择记录项目"></section>
    <div class="summary-row"><div id="counts" class="counts" aria-live="off"></div><button id="syncButton" class="sync" aria-label="查看同步状态"><span class="dot"></span><span id="syncText"></span></button></div>
    <p id="storageError" class="notice" role="alert"></p>
    <div class="tools"><label class="search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="搜姓名 / 学号" aria-label="搜索姓名或学号"></label><button id="batchButton" class="primary">登记未交名单</button><button id="undoButton" class="secondary" disabled>↶ 撤销</button></div>
    <section id="roster" class="roster" aria-label="学生名单"></section>
    <footer class="footnote"><span id="instruction"></span><button id="settingsButton">模拟网络与体验说明</button></footer>
  </main>
</div>
<div id="toast" class="toast" role="status" hidden></div><div id="live" aria-live="polite"></div>
<dialog id="batchDialog" aria-labelledby="batchTitle"><div class="dialog-shell"><header class="dialog-head"><h2 id="batchTitle">登记未交名单</h2><button class="icon-button" data-close="batchDialog" aria-label="关闭批量登记">✕</button></header><div class="dialog-body"><p class="muted" id="batchHelp"></p><div id="batchSummary" class="batch-summary" aria-live="polite"></div><label class="search batch-search"><input id="batchSearch" type="search" placeholder="找学生，只勾选未交者" aria-label="搜索未交名单学生"></label><div id="batchList" class="batch-list"></div></div><footer class="dialog-footer"><p id="batchEffect" class="muted"></p><button id="applyBatch" class="primary">确认登记</button></footer></div></dialog>
<dialog id="historyDialog" aria-labelledby="historyTitle"><div class="dialog-shell"><header class="dialog-head"><h2 id="historyTitle">本次记录</h2><button class="icon-button" data-close="historyDialog" aria-label="关闭本次记录">✕</button></header><div class="dialog-body"><p id="historyContext" class="muted"></p><div id="historyList"></div></div></div></dialog>
<dialog id="settingsDialog" aria-labelledby="settingsTitle"><div class="dialog-shell"><header class="dialog-head"><h2 id="settingsTitle">体验不同网络</h2><button class="icon-button" data-close="settingsDialog" aria-label="关闭网络设置">✕</button></header><div class="dialog-body"><p class="muted">这里模拟后台确认的等待。点名先记在此浏览器，确认过程不会锁住名单。原型不连接真实服务器。</p><div class="settings-row"><div><label>模拟网络</label><small>断开后仍可点名、撤销、切换项目</small></div><button id="networkToggle" class="switch">已连接</button></div><div class="settings-row"><div><label for="delaySlider">模拟确认延迟</label><small id="delayLabel">约 1 秒</small></div><input id="delaySlider" type="range" min="300" max="3000" step="100" value="1200"></div><div class="settings-row"><div><label>本地记录与同步</label><small id="syncDetail"></small></div></div><p class="muted" style="margin-top:15px">可依次试：连续点 10 人 → 同一学生连续记表现 → 撤销 → 断网后继续点名 → 刷新后重连。<br><br>收交项目点一次记为已收，重复点击不会多计；表现项目每点一次加一。新一次检查会保留之前的记录。</p></div></div></dialog>
<dialog id="projectDialog" aria-labelledby="projectTitle"><form id="projectForm" class="dialog-shell"><header class="dialog-head"><h2 id="projectTitle">新建记录项目</h2><button type="button" class="icon-button" data-close="projectDialog" aria-label="关闭新建项目">✕</button></header><div class="dialog-body"><label class="form-label">项目名称<input id="projectName" required maxlength="24" placeholder="例如：课前准备"></label><label class="form-label">类型<select id="projectType"><option value="completion">学业 · 完成情况</option><option value="pass">学业 · 通过情况</option><option value="event">表现 · 每发生一次记一次</option></select></label><p class="muted">只添加到此原型，保存后直接进入名单。</p></div><footer class="dialog-footer"><button type="submit" class="primary">保存并开始记录</button></footer></form></dialog>
<script>
'use strict';
const KEY='qingsong:classroom-interaction-prototype:v1';
const $=id=>document.getElementById(id);
const baseProjects=[{id:'collection',label:'作业收交',mode:'completion',positive:'已收',negative:'未交'},{id:'correction',label:'练习订正',mode:'completion',positive:'完成',negative:'未完'},{id:'recitation',label:'背诵检查',mode:'pass',positive:'通过',negative:'未过'},{id:'participation',label:'主动发言',mode:'event'},{id:'cooperation',label:'合作互助',mode:'event'}];
const names=['陈一诺','林子轩','王思涵','李沐阳','张语桐','刘奕辰','赵梓萱','周书言','吴欣然','徐景行','孙雨桐','胡星宇','朱可欣','高浩然','何嘉宁','郭亦凡','罗诗涵','郑子墨','梁心悦','谢知远','宋安然','唐宇航','许佳怡','韩明轩','冯语晨','邓清和','曹若溪','彭逸晨','曾思源','肖予安','田舒然','董景然','袁依诺','潘子衿','蒋星禾','蔡雨泽','余书瑶','杜亦辰','叶可宁','苏以恒'];
const fresh=()=>({version:1,projects:[],events:[],view:{classId:'a',projectId:'collection',date:'2026-10-21',round:1},offline:false,delay:1200});
let store;try{const s=JSON.parse(localStorage.getItem(KEY)||'null');store=s&&s.version===1&&Array.isArray(s.events)?s:fresh()}catch{store=fresh()}
// Reloading keeps the same event IDs. The simulator never increments a fact on acknowledgement.
store.events.forEach(e=>{if(e.sync==='sending')e.sync='queued'});
let query='',batchMissing=new Set(),batchScope=[],toastTimer,flushTimer,ackTimer,inFlight=[];
const uid=()=>crypto.randomUUID();
const projects=()=>[...baseProjects,...store.projects];
const project=()=>projects().find(p=>p.id===store.view.projectId)||baseProjects[0];
const roster=()=>names.slice(0,store.view.classId==='a'?40:32).map((name,i)=>({id:store.view.classId+'-'+i,name,no:String(i+1)}));
const scope=()=>[store.view.classId,store.view.projectId,store.view.date,store.view.round].join('|');
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));$('storageError').textContent='';return true}catch{$('storageError').textContent='此浏览器暂时不能保留原型记录，本次操作未记下。请允许本地存储后重试。';return false}}
function activeEvents(s=scope()){const events=store.events.filter(e=>e.scope===s);const undone=new Set(events.filter(e=>e.kind==='undo').map(e=>e.target));return events.filter(e=>e.kind!=='undo'&&!undone.has(e.id))}
function values(s=scope()){const map=new Map();activeEvents(s).forEach(e=>{if(e.kind==='add')map.set(e.studentId,{count:(map.get(e.studentId)?.count||0)+1});else map.set(e.studentId,{result:e.result})});return map}
function notify(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,1600)}
function announce(text){$('live').textContent=text}
function addEvents(changes,label){const group=uid(),time=new Date().toISOString();const additions=changes.map(c=>({...c,id:uid(),scope:scope(),group,label,time,sync:'queued'}));store.events.push(...additions);if(!persist()){store.events.splice(-additions.length);return false}update();schedule();return true}
function tap(studentId){const p=roster().find(p=>p.id===studentId);if(!p)return;const pr=project(),v=values().get(studentId);if(pr.mode!=='event'&&v?.result==='positive'){pulse(studentId,false);return}if(addEvents([{kind:pr.mode==='event'?'add':'set',studentId,name:p.name,result:'positive'}],pr.mode==='event'?pr.label:pr.positive)){pulse(studentId,pr.mode==='event');announce(p.name+'，'+(pr.mode==='event'?'已记'+values().get(studentId).count+'次':pr.positive))}}
function negative(studentId){const p=roster().find(p=>p.id===studentId);if(!p||values().get(studentId)?.result==='negative')return;addEvents([{kind:'set',studentId,name:p.name,result:'negative'}],project().negative)}
function pulse(id,plus){const card=document.querySelector('[data-student="'+id+'"]');if(!card||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const badge=card.querySelector('.student-mark');if(badge)badge.animate([{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:160,easing:'ease-out'});if(plus){const el=document.createElement('span');el.className='plus-one';el.textContent='+1';el.setAttribute('aria-hidden','true');card.append(el);el.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-17px)'}],{duration:380,easing:'ease-out'}).onfinish=()=>el.remove()}}
function undo(){const current=activeEvents();if(!current.length)return;const last=current.at(-1);const targets=current.filter(e=>e.group===last.group);if(addEvents(targets.map(e=>({kind:'undo',target:e.id,studentId:e.studentId,name:e.name})),'撤销上次操作'))notify('已撤销'+(targets.length>1?' '+targets.length+' 人':' '+last.name))}
function schedule(){if(store.offline||ackTimer||flushTimer)return;flushTimer=setTimeout(()=>{flushTimer=null;const jobs=store.events.filter(e=>e.sync==='queued').slice(0,100);if(!jobs.length)return;inFlight=jobs.map(e=>e.id);jobs.forEach(e=>e.sync='sending');persist();updateSync();ackTimer=setTimeout(()=>{ackTimer=null;const ids=new Set(inFlight);store.events.forEach(e=>{if(ids.has(e.id))e.sync='synced'});inFlight=[];persist();updateSync();if($('historyDialog').open)renderHistory();schedule()},store.delay)},220)}
function toggleNetwork(){store.offline=!store.offline;if(store.offline){clearTimeout(flushTimer);clearTimeout(ackTimer);flushTimer=null;ackTimer=null;store.events.forEach(e=>{if(e.sync==='sending')e.sync='queued'});inFlight=[]}persist();updateSync();if(!store.offline)schedule()}
function updateSync(){const pending=store.events.filter(e=>e.sync!=='synced').length;const offline=store.offline;const text=offline?(pending?'本机已记 · '+pending+'笔待同步':'模拟离线'):pending?'同步中 · '+pending+'笔':'已同步';$('syncText').textContent=text;$('syncButton').classList.toggle('pending',offline||pending>0);$('syncButton').setAttribute('aria-label','查看同步状态：'+text);$('networkToggle').textContent=offline?'已断开 · 点击重连':'已连接 · 点击断开';$('networkToggle').classList.toggle('off',offline);$('syncDetail').textContent=pending?pending+'笔已在本浏览器保留，'+(offline?'重连后模拟同步。':'正在等待模拟确认。'):'当前操作已全部模拟确认。';$('delaySlider').value=store.delay;$('delayLabel').textContent='约 '+(store.delay/1000).toFixed(1)+' 秒（模拟）'}
function renderProjects(){$('projects').innerHTML=['study','event'].map(category=>'<div class="project-row"><span class="project-label">'+(category==='study'?'学业':'表现')+'</span><div class="project-scroll">'+projects().filter(p=>(p.mode==='event')===(category==='event')).map(p=>'<button class="project" aria-pressed="'+(p.id===store.view.projectId)+'" data-project="'+p.id+'">'+escape(p.label)+'</button>').join('')+'<button class="add-project" data-add="'+category+'" aria-label="新建'+(category==='study'?'学业':'表现')+'项目">＋项目</button></div></div>').join('')}
function renderContext(){const p=project();$('classSelect').value=store.view.classId;$('dateSelect').value=store.view.date;const prefix=[store.view.classId,store.view.projectId,store.view.date].join('|')+'|';const rounds=[...new Set([1,store.view.round,...store.events.filter(e=>e.scope.startsWith(prefix)).map(e=>Number(e.scope.split('|')[3]))])].sort((a,b)=>a-b);$('roundSelect').innerHTML=rounds.map(r=>'<option value="'+r+'">第'+r+'次</option>').join('');$('roundSelect').value=store.view.round;$('roundSelect').hidden=p.mode==='event';$('newRound').hidden=p.mode==='event';$('batchButton').hidden=p.mode==='event';$('batchButton').textContent='登记'+p.negative+'名单';$('instruction').textContent=p.mode==='event'?'每点一次记一次，同一学生可连续记录。':'点卡片记为'+p.positive+'；已有结果可撤销，不重复计数。'}
function renderRoster(){const p=project();const list=roster().filter(s=>!query||(s.name+' '+s.no).includes(query));$('roster').innerHTML=list.map(s=>'<article class="student" data-student="'+s.id+'"><button class="name-button" data-tap="'+s.id+'" aria-label="'+escape('记录'+s.name+p.label)+'"><span class="student-no">'+s.no+'</span><span class="student-copy"><span class="student-name">'+s.name+'</span>'+(p.mode==='event'?'':'<span class="student-state"></span>')+'</span><span class="student-mark"></span></button>'+(p.mode==='event'?'':'<button data-negative="'+s.id+'" aria-label="'+escape('标记'+s.name+p.negative)+'">'+p.negative+'</button>')+'</article>').join('')||'<p class="empty">没有找到这位学生，换个姓名或学号试试。</p>';update()}
function update(){const p=project(),v=values();document.querySelectorAll('[data-student]').forEach(card=>{const result=v.get(card.dataset.student);card.classList.toggle('positive',p.mode==='event'?Boolean(result?.count):result?.result==='positive');card.classList.toggle('negative',result?.result==='negative');card.querySelector('.student-mark').textContent=p.mode==='event'?(result?.count||''):result?.result==='positive'?'✓':'';const state=card.querySelector('.student-state');if(state){state.textContent=result?.result==='positive'?p.positive:result?.result==='negative'?p.negative:'未登记';const btn=card.querySelector('[data-negative]');btn.hidden=Boolean(result?.result)}});const data=roster().map(s=>v.get(s.id));const pos=data.filter(x=>x?.result==='positive').length,neg=data.filter(x=>x?.result==='negative').length;const metrics=p.mode==='event'?[[p.label,data.reduce((n,x)=>n+(x?.count||0),0)+'次'],['涉及学生',data.filter(x=>x?.count).length+'人']]:[[p.positive,pos],[p.negative,neg],['未登记',data.length-pos-neg]];$('counts').innerHTML=metrics.map(([label,n])=>'<span class="count">'+escape(label)+'<b>'+n+'</b></span>').join('');$('undoButton').disabled=!activeEvents().length;updateSync()}
function changeContext(patch){Object.assign(store.view,patch);query='';$('search').value='';persist();renderContext();renderProjects();renderRoster()}
function openBatch(){const p=project(),v=values();batchScope=roster();batchMissing=new Set(batchScope.filter(s=>v.get(s.id)?.result==='negative').map(s=>s.id));$('batchTitle').textContent='登记'+p.negative+'名单';$('batchHelp').textContent='范围：本班 '+batchScope.length+' 人。只勾选'+p.negative+'者，其余未登记学生记为'+p.positive+'；已有记录保留。';$('batchSearch').value='';$('batchSearch').placeholder='找学生，只勾选'+p.negative+'者';renderBatch();$('batchDialog').showModal()}
function renderBatch(){const p=project(),v=values(),q=$('batchSearch').value;const eligible=batchScope.filter(s=>!v.get(s.id)?.result);const missing=eligible.filter(s=>batchMissing.has(s.id)).length;const oldNegative=batchScope.filter(s=>v.get(s.id)?.result==='negative').length;$('batchSummary').innerHTML='<span>'+p.negative+'<b>'+(oldNegative+missing)+'</b>人</span><span>'+p.positive+'<b>'+(batchScope.length-oldNegative-missing)+'</b>人</span>';$('batchEffect').textContent='本次填写 '+eligible.length+' 人，已有 '+(batchScope.length-eligible.length)+' 人保留。';$('applyBatch').textContent=eligible.length?'确认登记 '+eligible.length+' 人':'当前没有未登记学生';$('applyBatch').disabled=!eligible.length;$('batchList').innerHTML=batchScope.filter(s=>!q||(s.name+' '+s.no).includes(q)).map(s=>{const known=v.get(s.id)?.result,checked=batchMissing.has(s.id);return '<label class="batch-person '+(checked?'checked ':'')+(known?'locked':'')+'"><input type="checkbox" data-missing="'+s.id+'" '+(checked?'checked ':'')+(known?'disabled':'')+'><span>'+s.no+' '+escape(s.name)+'</span>'+(known?'<small>'+escape(known==='positive'?p.positive:p.negative)+'</small>':'')+'</label>'}).join('')}
function applyBatch(){const v=values();const changes=batchScope.filter(s=>!v.get(s.id)?.result).map(s=>({kind:'set',studentId:s.id,name:s.name,result:batchMissing.has(s.id)?'negative':'positive'}));if(changes.length&&addEvents(changes,'名单登记')){$('batchDialog').close();notify('已登记 '+changes.length+' 人，可撤销整批')}}
function renderHistory(){const pr=project();$('historyContext').textContent=(store.view.classId==='a'?'七年级一班':'七年级二班')+' · '+pr.label+' · '+store.view.date+(pr.mode==='event'?'':' · 第'+store.view.round+'次');const events=store.events.filter(e=>e.scope===scope());const undone=new Set(events.filter(e=>e.kind==='undo').map(e=>e.target));const groups=new Map();events.forEach(e=>{if(!groups.has(e.group))groups.set(e.group,[]);groups.get(e.group).push(e)});$('historyList').innerHTML=[...groups.values()].reverse().map(group=>{const first=group[0],cancelled=group.every(e=>undone.has(e.id));const status=cancelled?'已撤销':group.some(e=>e.sync!=='synced')?'本机已记 · 待同步':'已模拟同步';return '<article class="history-item"><div class="history-title"><span>'+escape(first.label)+(group.length>1?' · '+group.length+'人':' · '+escape(first.name))+'</span><span class="history-state">'+status+'</span></div><p>'+new Date(first.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</p>'+(group.length>1?'<details><summary>查看名单</summary><p>'+group.map(e=>escape(e.name)+' · '+(e.kind==='undo'?'撤销':e.result==='negative'?pr.negative:e.kind==='add'?'+1':pr.positive)).join('，')+'</p></details>':'')+'</article>'}).join('')||'<p class="empty">本次还没有记录，直接点学生即可。</p>'}
$('roster').addEventListener('click',e=>{const tapButton=e.target.closest('[data-tap]'),negativeButton=e.target.closest('[data-negative]');if(tapButton)tap(tapButton.dataset.tap);if(negativeButton)negative(negativeButton.dataset.negative)});
$('projects').addEventListener('click',e=>{const button=e.target.closest('[data-project]'),add=e.target.closest('[data-add]');if(button)changeContext({projectId:button.dataset.project,round:1});if(add){$('projectForm').reset();$('projectType').value=add.dataset.add==='event'?'event':'completion';$('projectDialog').showModal()}});
$('classSelect').addEventListener('change',e=>changeContext({classId:e.target.value,round:1}));$('dateSelect').addEventListener('change',e=>{if(e.target.value)changeContext({date:e.target.value,round:1})});$('roundSelect').addEventListener('change',e=>changeContext({round:Number(e.target.value)}));$('newRound').addEventListener('click',()=>{changeContext({round:Math.max(...store.events.filter(e=>e.scope.startsWith([store.view.classId,store.view.projectId,store.view.date].join('|')+'|')).map(e=>Number(e.scope.split('|')[3])),store.view.round)+1});notify('已切换到新一次检查，原记录保留')});
$('search').addEventListener('input',e=>{query=e.target.value;renderRoster()});$('undoButton').addEventListener('click',undo);$('batchButton').addEventListener('click',openBatch);$('batchSearch').addEventListener('input',renderBatch);$('batchList').addEventListener('change',e=>{const id=e.target.dataset.missing;if(!id)return;e.target.checked?batchMissing.add(id):batchMissing.delete(id);renderBatch();$('batchList').querySelector('[data-missing="'+id+'"]')?.focus({preventScroll:true})});$('applyBatch').addEventListener('click',applyBatch);$('historyButton').addEventListener('click',()=>{renderHistory();$('historyDialog').showModal()});
for(const id of ['settingsButton','syncButton'])$(id).addEventListener('click',()=>{updateSync();$('settingsDialog').showModal()});$('networkToggle').addEventListener('click',toggleNetwork);$('delaySlider').addEventListener('input',e=>{store.delay=Number(e.target.value);persist();updateSync()});
document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>$(button.dataset.close).close()));document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}}));
$('projectForm').addEventListener('submit',e=>{e.preventDefault();const label=$('projectName').value.trim(),mode=$('projectType').value;if(!label)return;if(projects().some(p=>p.label===label)){notify('同名项目已存在，请直接选择');return}const p={id:'custom-'+uid(),label,mode,positive:mode==='pass'?'通过':'完成',negative:mode==='pass'?'未过':'未完'};store.projects.push(p);if(persist()){$('projectDialog').close();changeContext({projectId:p.id,round:1})}else store.projects.pop()});
renderContext();renderProjects();renderRoster();schedule();
</script>
</body></html>
