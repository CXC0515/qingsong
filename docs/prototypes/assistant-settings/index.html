<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>青松 · 助手设置原型</title><link rel="stylesheet" href="./prototype.css"></head>
<body>
<header class="prototype-bar"><span><strong>青松 · 助手原型</strong><small>v0.8 · 全部为模拟数据</small></span><nav aria-label="原型场景"><button data-scene="settings" aria-pressed="true">会话设置</button><button data-scene="general" aria-pressed="false">主设置</button><button data-scene="chat" aria-pressed="false">会话流程</button></nav><label class="demo-mode-label">演示条件<select id="demo-mode" aria-label="演示条件"><option value="normal">正常流程</option><option value="queue">发送后排队</option><option value="conflict">版本冲突</option><option value="unknown">提交结果未知</option><option value="history">历史读取较慢</option></select></label><button id="phone-toggle" aria-pressed="false">手机画幅</button></header>
<div id="preview"><div class="app">
<header class="app-header"><div class="brand"><img src="./brand.png" alt=""><strong>青松教师</strong></div><span id="breadcrumb">AI 助手 / 会话设置</span><button id="return-chat" class="text-button">返回助手 <span aria-hidden="true">↗</span></button></header>
<div id="settings-scene" class="settings-shell"><aside class="settings-nav" aria-label="助手设置"><h1>AI 助手</h1><div id="settings-links"></div><p class="nav-note">工作方法、记忆与能力<br>按作用范围查看</p></aside><main id="settings-content" tabindex="-1"></main></div>
<div id="chat-scene" class="chat-shell" hidden><aside id="chat-sidebar" class="chat-sidebar" aria-label="会话侧栏"><div class="chat-side-head"><strong>会话</strong><button id="collapse-sidebar" class="icon-button" aria-label="收起会话侧栏" data-icon="panel-left"></button></div><button class="new-chat material"><span class="lg-content">＋ 新对话</span></button><div class="conversation-list"><span class="nav-caption">今天</span><button class="selected">本周的教学安排</button><button>课堂讨论怎么组织</button><span class="nav-caption">昨天</span><button>七年级的备课思路</button></div><footer class="chat-side-footer"><button id="sidebar-settings" class="icon-button" aria-label="打开助手设置" title="助手设置" data-icon="settings"></button></footer></aside><main class="chat-main"><button id="expand-sidebar" class="icon-button expand-sidebar" aria-label="展开会话侧栏" data-icon="panel-left" hidden></button><div class="chat-reading"><p class="user-message">帮我理一下这周的备课思路。</p><div class="answer"><span class="assistant-mark">青松</span><h2>先把本周的重点定下来</h2><p>可以从本周的教学目标出发，再安排阅读、讨论和课堂练习。我们先确定最需要学生掌握的一件事。</p><p>这周你想重点推进哪一课？</p></div></div><div class="composer"><label class="sr-only" for="chat-draft">消息</label><textarea id="chat-draft" rows="2" placeholder="继续聊聊教学上的事…"></textarea><div><span>青松教学助手</span><button class="send material" id="send-demo" aria-label="发送演示消息"><span class="lg-content" data-icon="arrow-up"></span></button></div></div></main></div>
</div></div>
<dialog id="entry-dialog" class="entry-dialog" aria-labelledby="dialog-title"><header><div><span class="eyebrow" id="dialog-category"></span><h2 id="dialog-title"></h2></div><button id="close-entry" class="icon-button" aria-label="关闭详情" data-icon="x"></button></header><form id="entry-form"><div class="entry-body"><label for="entry-content" id="content-label">内容</label><textarea id="entry-content" rows="6" maxlength="600"></textarea><div class="entry-meta" id="entry-meta"></div><details><summary>有效期与来源</summary><label for="entry-expiry">有效至 <small>留空则长期有效</small></label><input type="date" id="entry-expiry"><div id="entry-source"></div></details><div id="history-panel" hidden></div></div><footer><div class="more-wrap"><button id="more-entry" type="button" class="icon-button" aria-label="更多操作" aria-expanded="false" data-icon="more"></button><div id="more-menu" class="more-menu" hidden><button type="button" id="toggle-entry">停用这条记录</button><button type="button" id="history-entry">查看修改记录</button><button type="button" id="delete-entry" class="danger-text">删除这条记录</button></div></div><button id="save-entry" class="material primary" type="submit"><span class="lg-content">保存修改</span></button></footer></form></dialog>
<dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p id="confirm-body"></p><footer><button id="confirm-cancel" class="text-button">取消</button><button id="confirm-yes" class="material primary"><span class="lg-content">确认</span></button></footer></dialog>
<div id="toast" role="status" hidden></div>
<script type="module" src="./prototype.js"></script></body></html>
